[project]
name = ""
version = "1.0.0"
description = "ruff ALL + mypy --strict）"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

extend-exclude = [
    "*.md",
    ".vendor",
    "_shaderc-src",
    "deps_cache",
    "_deps",
    "_deps_*",
    "install-prefix",
    "build",
    "build-*",
    ".cpm-cache",
    "tmp",
    "cmake-tests/**/conanfile.py",
    "cmake-tests/**/docs/source/conf.py",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "ISC002",
    "E501",
    "W191",
    "D203",
    "D213",
    "D400",
    "D401",
    "D403",
    "D415",
    "CPY001",
    "INP001",
    "T201",
    "S603",
    "S607",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"cmake-tests/msvc/run_msvc.py" = ["S105"]
"cmake-tests/thread-pool/run_thread_pool.py" = ["S105"]
"tools/check_python_style.py" = []

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
show_column_numbers = true
warn_unreachable = true
disallow_any_explicit = true
disallow_any_unimported = true
no_implicit_reexport = true
enable_error_code = [
    "redundant-expr",
    "truthy-bool",
    "ignore-without-code",
    "unused-awaitable",
    "explicit-override",
]
